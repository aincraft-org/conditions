name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mintychochip/databag
          ref: 373f7d0991e121afbcccf32015105010cafab2be
          path: databag
          fetch-depth: 1
      - name: Link databag local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/databag" "$GITHUB_WORKSPACE/../databag"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish databag local Maven artifacts
        working-directory: databag
        run: |
          chmod +x gradlew
          ./gradlew publishAllPublicationsToLocalBuildRepoRepository --no-daemon
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon test
